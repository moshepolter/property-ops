<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Tab icon — real files in /public, not a data URI (more reliably picked up
         by browsers and hosting CDNs than an inline base64 icon). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- PWA manifest — lets Android/Chrome install this to the home screen -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E2A38" />

    <!-- iOS "Add to Home Screen" support (Safari ignores the manifest for this) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Property Ops" />

    <title>Property Ops</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
